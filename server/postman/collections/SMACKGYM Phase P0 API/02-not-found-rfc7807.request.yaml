$kind: http-request
name: RFC 7807 Not Found Check
order: 2000
method: GET
url: '{{baseUrl}}/v1/nonexistent'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
        pm.response.to.have.status(404);
      });
      pm.test("Content-Type is application/problem+json", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
      });
      pm.test("Valid RFC 7807 payload", function () {
        const json = pm.response.json();
        pm.expect(json.type).to.eql("https://api.smackgym.com/errors/not_found");
        pm.expect(json.code).to.eql("not_found");
        pm.expect(json.status).to.eql(404);
        pm.expect(json.title).to.eql("Not Found");
        pm.expect(json.timestamp).to.be.a("string");
      });
