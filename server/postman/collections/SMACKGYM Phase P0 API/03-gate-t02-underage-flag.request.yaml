$kind: http-request
name: Gate T02 Underage is18Plus False
order: 3000
method: POST
url: '{{baseUrl}}/v1/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "minor_flag@test.smackgym.co.uk",
      "password": "Password123!",
      "fullName": "Underage Flag",
      "is18Plus": false,
      "consentGiven": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403 Forbidden", function () {
        pm.response.to.have.status(403);
      });
      pm.test("RFC 7807 code is forbidden_underage", function () {
        const json = pm.response.json();
        pm.expect(json.code).to.eql("forbidden_underage");
        pm.expect(json.type).to.eql("https://api.smackgym.com/errors/forbidden_underage");
      });
