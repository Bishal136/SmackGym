$kind: http-request
name: Gate T01 Login Success
order: 9000
method: POST
url: '{{baseUrl}}/v1/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "StrongPassword2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Valid token pair issued upon login", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.tokens.accessToken).to.be.a("string");
        pm.expect(json.data.tokens.refreshToken).to.be.a("string");

        pm.environment.set("accessToken", json.data.tokens.accessToken);
        pm.environment.set("refreshToken", json.data.tokens.refreshToken);
      });
