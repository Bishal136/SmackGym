$kind: http-request
name: Authenticated User Profile Check
order: 10000
method: GET
url: '{{baseUrl}}/v1/auth/me'
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Returns authenticated athlete profile", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.email).to.eql(pm.environment.get("testEmail"));
        pm.expect(json.data.role).to.eql("ATHLETE");
      });
