$kind: http-request
name: Gate T01 Refresh Token Rotation
order: 11000
method: POST
url: '{{baseUrl}}/v1/auth/refresh'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Rotated access and refresh tokens returned", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.accessToken).to.be.a("string");
        pm.expect(json.data.refreshToken).to.be.a("string");

        pm.environment.set("newAccessToken", json.data.accessToken);
        pm.environment.set("newRefreshToken", json.data.refreshToken);
      });
