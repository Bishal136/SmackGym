$kind: http-request
name: Gate T05 Deterministic Plan Generation
order: 5000
method: POST
url: '{{baseUrl}}/v1/plans/generate'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{athleteToken}}'
body:
  type: json
  content: |-
    {
      "targetDate": "2026-12-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Plan exercises and revision initialized", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.exercises).to.be.an("array");
        pm.expect(json.data.exercises.length).to.be.above(0);
        pm.expect(json.data.revision).to.eql(1);
        pm.expect(json.data.status).to.eql("generated");

        pm.environment.set("planId", json.data._id);
        pm.environment.set("planRevision", json.data.revision);
      });
