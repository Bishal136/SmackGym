$kind: http-request
name: Gate T04 Plan Acceptance (Revision Match)
order: 7000
method: POST
url: '{{baseUrl}}/v1/plans/accept'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{athleteToken}}'
body:
  type: json
  content: |-
    {
      "planId": "{{planId}}",
      "expectedRevision": {{planRevision}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Plan successfully accepted with incremented revision", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.status).to.eql("accepted");
        pm.expect(json.data.revision).to.eql(3);
      });
