$kind: http-request
name: Gate T03 Offline Batch Deduplication Idempotency
order: 14000
method: POST
url: '{{baseUrl}}/v1/session-events/batch'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{athleteToken}}'
body:
  type: json
  content: '{{batchPayload}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Duplicate batch deduplicated idempotently", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.totalReceived).to.eql(50);
        pm.expect(json.data.insertedCount).to.eql(0);
        pm.expect(json.data.duplicateCount).to.eql(50);
      });
