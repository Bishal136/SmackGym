$kind: http-request
name: Daily Recovery Checkin
order: 15000
method: POST
url: '{{baseUrl}}/v1/recovery/checkins'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{athleteToken}}'
body:
  type: json
  content: |-
    {
      "sleepQuality": 4,
      "sorenessLevel": 2,
      "energyLevel": 4,
      "stressLevel": 2,
      "loggedAt": "2026-12-01T08:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Daily Readiness Index calculated in 0-100 range", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.readinessScore).to.be.within(75, 100);
      });
