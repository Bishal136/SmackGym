$kind: http-request
name: Gate T08 AI Plan Generation Blocked Under Kill Switch
order: 21000
method: POST
url: '{{baseUrl}}/v1/plans/generate'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{athleteToken}}'
body:
  type: json
  content: |-
    {
      "targetDate": "2026-12-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403 Forbidden", function () {
        pm.response.to.have.status(403);
      });
      pm.test("Rejection code is ai_kill_switch_active", function () {
        const json = pm.response.json();
        pm.expect(json.code).to.eql("ai_kill_switch_active");
        pm.expect(json.detail).to.include("kill switch");
      });
