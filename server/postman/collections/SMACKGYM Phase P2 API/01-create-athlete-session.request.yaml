$kind: http-request
name: P2 Athlete Setup & Registration
order: 1000
method: POST
url: '{{baseUrl}}/v1/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{p2AthleteEmail}}",
      "password": "StrongPassword2026!",
      "fullName": "Phase Two Athlete",
      "is18Plus": true,
      "birthDate": "1998-06-20T00:00:00.000Z",
      "consentGiven": true
    }
scripts:
  - type: beforeRequest
    code: |-
      const uniqueEmail = "p2_athlete_" + Date.now() + "@test.smackgym.co.uk";
      pm.environment.set("p2AthleteEmail", uniqueEmail);
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Tokens generated and saved to environment", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.tokens.accessToken).to.be.a("string");
        pm.environment.set("p2AthleteToken", json.data.tokens.accessToken);
        pm.environment.set("p2AthleteId", json.data.user.id);
      });
