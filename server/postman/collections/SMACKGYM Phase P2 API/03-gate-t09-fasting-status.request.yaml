$kind: http-request
name: 'Gate T09: Query Ramadan Fasting & Circadian Hydration Status'
order: 3000
method: GET
url: '{{baseUrl}}/v1/fasting/status'
headers:
  - key: Authorization
    value: 'Bearer {{p2AthleteToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Fasting status confirms active Ramadan mode", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.isFastingRamadan).to.eql(true);
        pm.expect(["suhoor", "iftar"]).to.include(json.data.nextAllowedMeal);
      });
