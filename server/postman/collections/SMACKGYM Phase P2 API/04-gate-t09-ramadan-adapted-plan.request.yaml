$kind: http-request
name: 'Gate T09: Generate Plan with Ramadan Volume & Hydration Adaptation'
order: 4000
method: POST
url: '{{baseUrl}}/v1/plans/generate'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{p2AthleteToken}}'
body:
  type: json
  content: |-
    {
      "targetDate": "2026-03-20"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Plan rationale includes ADAPT_RAMADAN_HYDRATION_SHIFT", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.rationaleCodes).to.include("ADAPT_RAMADAN_HYDRATION_SHIFT");
        json.data.exercises.forEach(function (ex) {
          pm.expect(ex.targetSets).to.be.at.most(2);
        });
      });
