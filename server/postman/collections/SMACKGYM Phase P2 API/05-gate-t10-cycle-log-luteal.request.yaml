$kind: http-request
name: 'Gate T10: Log High-Symptom Menstrual Cycle Luteal Phase'
order: 5000
method: POST
url: '{{baseUrl}}/v1/cycle/log'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{p2AthleteToken}}'
body:
  type: json
  content: |-
    {
      "cycleDay": 22,
      "overallSymptomSeverity": 4,
      "crampsSeverity": 3,
      "fatigueSeverity": 4,
      "notes": "High fatigue luteal phase"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Automatic deload suggested with 25% volume drop", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.phase).to.eql("luteal");
        pm.expect(json.data.deloadRecommended).to.eql(true);
        pm.expect(json.data.volumeMultiplier).to.eql(0.75);
        pm.expect(json.data.adaptationReasonCode).to.eql("ADAPT_MENSTRUAL_LUTEAL_DELOAD");
      });
