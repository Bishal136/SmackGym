$kind: http-request
name: 'P3 Athlete Configures Religious Fasting (Ramadan)'
order: 3000
method: POST
url: '{{baseUrl}}/v1/fasting/config'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{p3AthleteToken}}
body:
  type: json
  content: |-
    {
      "isActive": true,
      "fastingType": "RAMADAN",
      "fajrTime": "04:30",
      "maghribTime": "18:30",
      "shiftTrainingHours": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 201", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("Ramadan config saved", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
      });
