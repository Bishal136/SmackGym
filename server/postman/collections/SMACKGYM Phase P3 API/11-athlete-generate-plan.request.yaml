$kind: http-request
name: 'Athlete Generates Microcycle Plan for Adaptation'
order: 11000
method: POST
url: '{{baseUrl}}/v1/plans/generate'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{p3AthleteToken}}
body:
  type: json
  content: |-
    {
      "targetDate": "2026-04-01T00:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Plan ID saved to environment", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.environment.set("p3PlanId", json.data._id);
      });
