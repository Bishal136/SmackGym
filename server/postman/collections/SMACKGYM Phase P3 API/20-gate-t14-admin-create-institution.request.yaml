$kind: http-request
name: 'Gate T14: Admin Creates Enterprise University Partner (@*.ac.uk)'
order: 20000
method: POST
url: '{{baseUrl}}/v1/institutions'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{p3AdminToken}}
body:
  type: json
  content: |-
    {
      "name": "King's College London Athletic Union",
      "domainPattern": "@.*\\.ac\\.uk$",
      "totalSeats": 500
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Gate T14: Institution initialized with 500 seats", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.totalSeats).to.eql(500);
        pm.expect(json.data.usedSeats).to.eql(0);
        pm.environment.set("p3InstitutionId", json.data._id);
      });
